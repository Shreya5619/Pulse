# Battery Memory
# Profile of device battery behavior.
# Mapping: Calculated from battery level drops in ContextSnapshots.
# Updated: Per session or on significant change in drain rate.

profile:
  discharge_rates:
    active: 0.12 # 12% per hour when screen is on
    standby: 0.02 # 2% per hour when idle
  thresholds:
    low: 0.25
    critical: 0.15
  risky_hours:
    - start: "17:00"
      end: "20:00"
      reason: "Commute/Gym period, no charger access"
  typical_charge_windows:
    - start: "23:00"
      end: "06:30"
last_updated: "2026-04-24T12:00:00Z"
